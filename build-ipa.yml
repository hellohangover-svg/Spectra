name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests (iOS Simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild test -project Spectra.xcodeproj -scheme Spectra -destination "id=$UDID" | tail -n 60

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project Spectra.xcodeproj -scheme Spectra -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Spectra.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/Spectra.xcarchive/Products/Applications/Spectra.app Payload/
          zip -qr Spectra-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Spectra-unsigned-ipa
          path: Spectra-unsigned.ipa
